name: Publish owner-approved AVEN offer
on:
  pull_request:
    paths:
      - '.github/workflows/publish-approved-offer.yml'
      - 'lib/catalog-offer.json'
      - 'scripts/publish-approved-offer.cjs'
permissions:
  contents: read
concurrency:
  group: aven-approved-offer-v1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mahinbro696-rgb/aven-website' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'professional-redesign'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish only the three merchant-approved product records
        env:
          PUBLISH_AVEN_APPROVED_OFFER: owner-approved-2026-10-01-1190-v1
        run: node scripts/publish-approved-offer.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: approved-offer-publication
          path: verification/approved-offer.json
          retention-days: 7
