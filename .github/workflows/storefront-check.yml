name: Storefront verification
on:
  pull_request:
    paths:
      - '.github/workflows/storefront-check.yml'
      - 'tests/**'
      - 'components/**'
      - 'app/**'
      - 'lib/**'
permissions:
  contents: read
concurrency:
  group: storefront-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Inspect installed framework instructions
        shell: bash
        run: |
          mkdir -p verification/framework-docs
          if test -d node_modules/next/dist/docs; then
            find node_modules/next/dist/docs/01-app -type f \( -name 'fetch.md' -o -name 'route.md' -o -name 'css.md' \) | while read -r file; do
              sed -n '1,160p' "$file"
              cp "$file" "verification/framework-docs/$(basename "$file")"
            done
          fi
      - name: Regression tests and production build
        run: |
          node --check tests/mobile-order-browser.cjs
          npm run build
      - name: Install isolated desktop and mobile browser tools
        run: |
          npm install --prefix /tmp/aven-browser --no-audit --no-fund playwright@1.56.1
          /tmp/aven-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Start production application
        run: |
          npm run start -- --port 3000 > /tmp/aven-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aven-server.log
          exit 1
      - name: Read-only checkout quote diagnostics
        run: node tests/quote-diagnostic.cjs
      - name: Mobile catalog, real quotes and mocked final-order browser checks
        env:
          NODE_PATH: /tmp/aven-browser/node_modules
        run: node tests/mobile-order-browser.cjs
      - name: Collect verification evidence
        if: always()
        run: |
          mkdir -p verification
          test ! -f /tmp/aven-server.log || cp /tmp/aven-server.log verification/server.log
          tar --exclude='./node_modules' --exclude='./.git' --exclude='./.next' --exclude='./source.tgz' -czf /tmp/source.tgz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-website-order-verification
          path: |
            verification/
            /tmp/source.tgz
          retention-days: 3
