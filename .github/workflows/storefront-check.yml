name: Storefront verification
on:
  pull_request:
    paths:
      - '.github/workflows/storefront-check.yml'
      - 'tests/storefront-browser.cjs'
permissions:
  contents: read
concurrency:
  group: storefront-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public product catalog without modifying any data
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = fs.readFileSync('lib/firebase.ts', 'utf8');
          const project = config.match(/projectId:\s*["']([^"']+)/)?.[1];
          const apiKey = config.match(/apiKey:\s*["']([^"']+)/)?.[1];
          if (!project || !apiKey) throw new Error('Firebase configuration not found');
          const url = `https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/documents/products?pageSize=100&key=${encodeURIComponent(apiKey)}`;
          try {
            const response = await fetch(url, {signal: AbortSignal.timeout(20000)});
            const data = await response.json();
            if (!response.ok) {
              console.log('CATALOG_DIAGNOSTIC', JSON.stringify({httpStatus: response.status, status: data.error?.status, message: data.error?.message}));
            } else {
              console.log('CATALOG_DIAGNOSTIC', JSON.stringify({httpStatus: response.status, count: data.documents?.length || 0, more: !!data.nextPageToken}));
              for (const doc of data.documents || []) {
                const f = doc.fields || {};
                console.log('PUBLIC_PRODUCT', JSON.stringify({id: doc.name.split('/').pop(), name: f.name, price: f.price, category: f.category, available: f.available, stock: f.stock, fieldNames: Object.keys(f)}));
              }
            }
          } catch (error) { console.log('CATALOG_NETWORK_ERROR', error.name); }
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Read installed framework instructions
        run: |
          if test -d node_modules/next/dist/docs; then
            find node_modules/next/dist/docs -type f | head -25
          else
            echo 'This installed package does not ship next/dist/docs.'
          fi
      - name: Run regression tests
        run: npm test
      - name: Archive source for independent inspection
        if: always()
        run: tar --exclude='./node_modules' --exclude='./.git' --exclude='./.next' --exclude='./source.tgz' -czf /tmp/source.tgz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-source
          path: /tmp/source.tgz
          retention-days: 3
